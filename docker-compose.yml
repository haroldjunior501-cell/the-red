services:
  postgres:
    image: postgres:16-alpine
    container_name: thered-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: thered
      POSTGRES_PASSWORD: thered_secret
      POSTGRES_DB: thered_db
    volumes:
      - thered_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thered -d thered_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thered-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://thered:thered_secret@postgres:5432/thered_db
      JWT_SECRET_KEY: the_red_prod_super_secret_mufc_2026
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: thered-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  thered_pgdata:
